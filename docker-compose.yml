services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite:////data/procureops.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - procureops-data:/data

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

volumes:
  procureops-data:

